# 职责：Gradle 全局构建参数（JVM 内存、AndroidX、Kotlin 代码风格等）

# 注意：这里**刻意不**加 -Dfile.encoding=UTF-8。
# 该参数只作用于 Gradle daemon，会让 daemon 以 UTF-8 写测试 Worker 的 classpath 参数文件，
# 而 fork 出的测试 JVM 按 Windows 平台默认编码（GBK）读取，导致路径被写坏、
# 表现为 "ClassNotFoundException"（classpath 正确却找不到测试类）。
# 保持「不做编码干预」可让两侧统一使用平台默认编码，中文路径与 ASCII 路径均可正常跑单测。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX 必须开启
android.useAndroidX=true
# 关闭 Jetifier（新工程无 support 库依赖，开启会拖慢构建）
android.enableJetifier=false
# Room 生成的 schema 目录通过 KSP 参数指定，这里声明非传递 R 类以加快编译
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true

# 工程已迁移到纯 ASCII 路径（D:\projects\checkin），无需再关闭 AGP 的路径检查。
# （原先的 android.overridePathCheck=true 会掩盖路径问题，已移除）
